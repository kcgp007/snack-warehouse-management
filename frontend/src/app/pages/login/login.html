<div class="login-card">
  <h1>零食仓库管理平台</h1>
  <p class="subtitle">请使用账号登录</p>
  <form (ngSubmit)="submit()">
    <label class="field">
      <span>用户名</span>
      <input
        name="username"
        autocomplete="username"
        [class.invalid]="touched().username && fieldError('username')"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        (blur)="markTouched('username')"
        placeholder="请输入用户名"
      />
      @if (touched().username && fieldError('username')) {
        <p class="field-error" role="alert">{{ fieldError('username') }}</p>
      }
    </label>
    <label class="field">
      <span>密码</span>
      <input
        name="password"
        type="password"
        autocomplete="current-password"
        [class.invalid]="touched().password && fieldError('password')"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        (blur)="markTouched('password')"
        placeholder="请输入密码"
      />
      @if (touched().password && fieldError('password')) {
        <p class="field-error" role="alert">{{ fieldError('password') }}</p>
      }
    </label>
    @if (error()) {
      <div class="form-error">{{ error() }}</div>
    }
    <button class="btn primary block" type="submit" [disabled]="submitting()">
      {{ submitting() ? '登录中…' : '登 录' }}
    </button>
  </form>
</div>
