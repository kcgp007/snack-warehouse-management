<section class="page-head">
  <h2>修改密码</h2>
  <p class="hint">修改当前登录账户的密码，新密码至少 6 位字符。</p>
</section>

@if (error()) {
  <div class="banner error">{{ error() }}</div>
}
@if (notice()) {
  <div class="banner notice">{{ notice() }}</div>
}

<form class="card" (ngSubmit)="submit()">
  <label class="field">
    <span>原密码</span>
    <input
      name="old-password"
      type="password"
      autocomplete="current-password"
      [class.invalid]="touched().oldPassword && fieldError('oldPassword')"
      [ngModel]="oldPassword()"
      (ngModelChange)="oldPassword.set($event)"
      (blur)="markTouched('oldPassword')"
    />
    @if (touched().oldPassword && fieldError('oldPassword')) {
      <p class="field-error" role="alert">{{ fieldError('oldPassword') }}</p>
    }
  </label>
  <label class="field">
    <span>新密码</span>
    <input
      name="new-password"
      type="password"
      autocomplete="new-password"
      [class.invalid]="touched().newPassword && fieldError('newPassword')"
      [ngModel]="newPassword()"
      (ngModelChange)="newPassword.set($event)"
      (blur)="markTouched('newPassword')"
      placeholder="至少 6 位字符"
    />
    @if (touched().newPassword && fieldError('newPassword')) {
      <p class="field-error" role="alert">{{ fieldError('newPassword') }}</p>
    }
  </label>
  <label class="field">
    <span>确认新密码</span>
    <input
      name="confirm-password"
      type="password"
      autocomplete="new-password"
      [class.invalid]="touched().confirmPassword && fieldError('confirmPassword')"
      [ngModel]="confirmPassword()"
      (ngModelChange)="confirmPassword.set($event)"
      (blur)="markTouched('confirmPassword')"
    />
    @if (touched().confirmPassword && fieldError('confirmPassword')) {
      <p class="field-error" role="alert">{{ fieldError('confirmPassword') }}</p>
    }
  </label>
  <button class="btn primary" type="submit" [disabled]="submitting()">
    {{ submitting() ? '提交中…' : '确认修改' }}
  </button>
</form>
