# 零食仓库管理平台配置示例
# 使用方式：复制为同目录下的 snack-warehouse.toml，按需修改后启动容器。
#   cp snack-warehouse.example.toml snack-warehouse.toml
#
# 配置从“当前工作目录”读取；容器内工作目录固定为 /app。
# 相对路径均相对于 /app，例如 data/app.db → 容器内 /app/data/app.db。

# 监听地址与端口；容器内必须为 0.0.0.0 才能被宿主机访问
host = "0.0.0.0"
port = 3000

# SQLite 数据库路径。compose 已把命名卷挂载到 /app/data，数据可持久化
db_path = "data/app.db"

# 静态资源目录，默认即二进制同目录的 static/，通常无需修改
# static_dir = "static"

# 首次启动时自动创建的管理员账户
# ⚠️ 部署前务必修改密码；启动后也可在页面中修改
admin_username = "admin"
admin_password = "change-me-please"
