version: '3.8'
services:
  app:
    build: .
    container_name: snack-warehouse
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - snack-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:3000/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  snack-data:
    driver: local
